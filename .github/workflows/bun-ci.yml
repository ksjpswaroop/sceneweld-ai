name: CI

permissions:
  contents: read

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  ci:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          auto-setup: true

      - name: Install GPUI Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake g++ gcc libasound2-dev \
            libfontconfig-dev libglib2.0-dev libssl-dev libva-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev lld llvm make \
            musl-dev musl-tools pkg-config

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Install API dependencies
        working-directory: apps/api
        run: bun install --frozen-lockfile

      - name: Run CI
        run: moon ci

      - name: Upload Moon report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moon-report-${{ matrix.os }}
          path: |
            .moon/cache/ciReport.json
            .moon/cache/runReport.json
          if-no-files-found: warn
          include-hidden-files: true

  package-desktop:
    name: Package desktop (macOS Apple Silicon)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
          auto-setup: true

      - name: Build locked release binary
        run: cargo build --release --locked --package opencut-desktop

      - name: Verify Apple Silicon binary
        run: |
          test "$(uname -m)" = "arm64"
          file target/release/opencut-desktop | grep -q "arm64"

      - name: Package deterministic archive
        run: >-
          python3 scripts/package_desktop.py
          --binary target/release/opencut-desktop
          --output dist/opencut-desktop-macos-arm64.zip

      - name: Rebuild package and verify deterministic archive
        run: |
          cp dist/opencut-desktop-macos-arm64.zip /tmp/opencut-desktop-first.zip
          python3 scripts/package_desktop.py --binary target/release/opencut-desktop --output dist/opencut-desktop-macos-arm64.zip
          cmp /tmp/opencut-desktop-first.zip dist/opencut-desktop-macos-arm64.zip

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencut-desktop-macos-arm64
          path: |
            dist/opencut-desktop-macos-arm64.zip
            dist/opencut-desktop-macos-arm64.zip.sha256
          if-no-files-found: error
          compression-level: 0
